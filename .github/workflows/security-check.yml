name: security-check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rust-security-check:
    name: security-check / rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: run repo security gate
        env:
          OSMAP_BOOTSTRAP_CARGO_AUDIT: "1"
          OSMAP_BOOTSTRAP_CARGO_DENY: "1"
        run: make security-check
