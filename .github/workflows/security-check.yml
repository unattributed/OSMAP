name: security-check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_tls_probes:
        description: "Run live TLS probes against the configured OSMAP HTTPS endpoint"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rust-security-check:
    name: security-check / rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: run repo security gate
        env:
          OSMAP_BOOTSTRAP_CARGO_AUDIT: "1"
          OSMAP_BOOTSTRAP_CARGO_DENY: "1"
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        run: make security-check

  v10-governance-check:
    name: security-check / v10 governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: run v10 governance gate
        run: make v10-check

  live-tls-probe:
    name: security-check / live tls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_live_tls_probes == 'true') || vars.RUN_LIVE_TLS_PROBES == '1' }}
    env:
      OSMAP_TLS_PROBE_TARGET: ${{ vars.OSMAP_TLS_PROBE_TARGET }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: run live TLS standard probe
        run: |
          python3 maint/security/osmap-live-tls-standard-validate.py             "${OSMAP_TLS_PROBE_TARGET:-https://mail.blackbagsecurity.com}"             --report maint/live/latest-host-tls-standard-report.json
