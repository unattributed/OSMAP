# Fixed anchor osmap/account-submission, evaluated BEFORE any broad quick pass.
# PF must be enabled and lo0 must NOT be skipped. A loopback address is not an
# isolation boundary. Syntax/current effective-rule checks precede installation.
pass out quick on lo0 inet proto tcp from 127.0.0.1 to 127.0.0.1 port 2525 user _osmapsubmit flags S/SA keep state
block return out quick on lo0 inet proto tcp from any to 127.0.0.1 port 2525
