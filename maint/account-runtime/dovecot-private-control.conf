# OSMAP-owned private account-control listeners.
service auth {
  unix_listener /var/dovecot/osmap-account-auth-master {
    mode = 0660
    user = root
    group = _osmapcontrol
  }
}
service anvil {
  unix_listener /var/dovecot/osmap-account-anvil {
    mode = 0660
    user = root
    group = _osmapcontrol
  }
}
