# Source-owned private auth-only service under the existing Dovecot master.
# Requires base_dir=/var/dovecot and the qualified private identity/listener.
# Public auth policy and passdb/userdb/auth-worker definitions stay authoritative.
service osmap-primary-auth {
  executable = auth -o auth_policy_server_url= -o auth_cache_size=0
  user = $default_internal_user
  process_limit = 1
  client_limit = 1
  service_count = 0
  unix_listener /var/dovecot/osmap-account-auth-client {
    mode = 0660
    user = _dovecot
    group = _osmapprimary
  }
}
